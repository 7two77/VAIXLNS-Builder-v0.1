[package]
name = "vaixlns-builder"
version = "0.1.0"
edition = "2021"
authors = ["VAIXLNS Team"]
description = "VAIXLNS Bootstrap Builder - Deterministic Specification Compiler"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "vaixlns-builder"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
